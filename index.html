<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <title>Entrainement de La Casa</title>

  <!-- Icônes -->
  <link rel="icon" type="image/png" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-512.png">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b1c2d" />

  <style>
    html, body { height: 100%; margin: 0; background: #0b1c2d; }
    #frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    #fallback {
      position: fixed; inset: 0; display: none;
      align-items: center; justify-content: center; padding: 20px;
      color: #fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      text-align: center;
    }
    .card {
      max-width: 520px; width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 16px;
      padding: 18px;
    }
    .btn {
      display: inline-block; margin-top: 12px;
      padding: 12px 16px; border-radius: 12px;
      background: #d6b15e; color: #0b1c2d; font-weight: 800;
      text-decoration: none;
    }
    .muted { opacity: .85; margin-top: 8px; }
    code { opacity: .9; }
  </style>
</head>
<body>

  <iframe id="frame" referrerpolicy="no-referrer"></iframe>

  <div id="fallback">
    <div class="card">
      <h2 style="margin:0 0 6px;">Entrainement de La Casa</h2>
      <div class="muted">
        Si l’appli ne s’affiche pas ici (blocage iframe), ouvre-la dans le navigateur.
      </div>
      <a id="openBtn" class="btn" href="#" rel="noopener">Ouvrir l’application</a>
      <div class="muted" style="margin-top:10px;">
        Astuce : installe depuis <code>github.io</code> pour garder la bonne icône.
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxJLDEutOHmlmNLsjmQBNBCU9pvG-ZM93ilE_XoNf4MWF_PwniGiauf3Z3nf5LpS0ao/exec";

    const frame = document.getElementById("frame");
    const fallback = document.getElementById("fallback");
    const openBtn = document.getElementById("openBtn");

    openBtn.href = GAS_URL;

    // charge l'app dans l'iframe
    frame.src = GAS_URL;

    // si l'iframe est bloquée, on affiche un fallback
    const t = setTimeout(() => {
      // si ça n'a pas chargé au bout de 3s, on montre le fallback
      fallback.style.display = "flex";
    }, 3000);

    frame.addEventListener("load", () => {
      clearTimeout(t);
      fallback.style.display = "none";
    });
  </script>

</body>
</html>
