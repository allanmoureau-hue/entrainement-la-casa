<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Entrainement de La Casa</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b1c2d">

  <link rel="icon" type="image/png" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-512.png">

  <style>
    html, body { margin:0; height:100%; background:#0b1c2d; color:#fff; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial; }
    .wrap { min-height:100%; display:flex; align-items:center; justify-content:center; padding:24px; }
    .card { width:min(560px, 100%); background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.10); border-radius:20px; padding:22px; text-align:center; }
    .btn { display:inline-block; margin-top:14px; padding:14px 18px; border-radius:14px; background:#f7d36b; color:#111; font-weight:800; text-decoration:none; }
    .muted { opacity:.85; margin-top:10px; line-height:1.35; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1 style="margin:0 0 8px 0;">Entrainement de La Casa</h1>
      <div class="muted">✅ Pour éviter le logo orange et les bugs d’affichage, installe l’app depuis ce lien.</div>
      <a class="btn" id="openBtn" href="#">Ouvrir l’application</a>
      <div class="muted" style="margin-top:14px;">
        Samsung Internet : menu ⋮ → <b>Ajouter à l’écran d’accueil</b><br>
        (assure-toi d’être sur <b>github.io</b>, pas <b>script.google.com</b>)
      </div>
    </div>
  </div>

  <script>
    const APP_URL = "https://script.google.com/macros/s/AKfycbxJLDEutOHmlmNLsjmQBNBCU9pvG-ZM93ilE_XoNf4MWF_PwniGiauf3Z3nf5LpS0ao/exec";

    // bouton
    document.getElementById("openBtn").onclick = (e) => {
      e.preventDefault();
      location.href = APP_URL;
    };

    // si lancé en "app installée", on redirige direct
    const isStandalone =
      window.matchMedia("(display-mode: standalone)").matches ||
      window.navigator.standalone === true;

    if (isStandalone) {
      location.replace(APP_URL);
    }
  </script>
</body>
</html>
