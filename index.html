<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Entrainement de La Casa</title>

  <link rel="icon" type="image/png" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-512.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b1c2d">

  <style>
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background:#0b1c2d;
      color:#fff;
      display:flex;
      min-height:100vh;
      align-items:center;
      justify-content:center;
      padding:20px;
      text-align:center;
    }
    .card{
      max-width:520px;
      width:100%;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      border-radius:18px;
      padding:22px;
    }
    .btn{
      display:inline-block;
      margin-top:14px;
      padding:12px 18px;
      border-radius:14px;
      background:#f7d36b;
      color:#111;
      font-weight:700;
      text-decoration:none;
    }
    .muted{opacity:.8;margin-top:10px;font-size:14px}
  </style>
</head>

<body>
  <div class="card">
    <h2>Entrainement de La Casa</h2>
    <p>✅ Pour éviter le logo orange et les bugs d’affichage, installe l’app depuis ce lien.</p>

    <a class="btn" id="open">Ouvrir l’application</a>

    <div class="muted">
      Samsung Internet : menu ⋮ → <b>Ajouter à l’écran d’accueil</b><br>
      (il faut être sur <b>github.io</b>, pas script.google.com)
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxJLDEutOHmlmNLsjmQBNBCU9pvG-ZM93ilE_XoNf4MWF_PwniGiauf3Z3nf5LpS0ao/exec";

    const isStandalone =
      window.matchMedia("(display-mode: standalone)").matches ||
      window.matchMedia("(display-mode: fullscreen)").matches ||
      window.navigator.standalone === true;

    // ✅ Redirection auto UNIQUEMENT si installé comme appli
    if (isStandalone) {
      location.replace(GAS_URL);
    }

    // sinon, bouton pour ouvrir (les joueurs peuvent quand même accéder)
    document.getElementById("open").href = GAS_URL;
  </script>
</body>
</html>
